# CI for GlitchSAT-Redundancy: runs the engine tests and re-derives the 36 baseline rows.
#
# The runner is pinned to ubuntu-24.04 on purpose: its apt packages are Yosys 0.33 and Icarus Verilog 12.0, the versions
# ci/expected_reproduce.json was recorded with. Another Yosys build can synthesize rtl/v2.v to a different netlist and
# give a different (still correct) minimum, which `make check-reproduce` reports as a mismatch. Do not change the runner
# to ubuntu-latest without re-measuring ci/expected_reproduce.json.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - name: Install Yosys and Icarus Verilog (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci/requirements-ci.txt numpy
          pip install "./product[test]"
      - name: Tool versions
        run: |
          make check-tools
          yosys -V | grep -q "Yosys 0.33" || echo "::warning::Yosys is not 0.33; ci/expected_reproduce.json was recorded with 0.33, so check-reproduce may report mismatches that are tool differences"
      - name: Engine tests (make test)
        run: make test
      - name: Product tests
        run: |
          pip install pyyaml jsonschema
          python -m pytest -q product/tests
      - name: Reproduce the baseline table (make reproduce)
        run: make reproduce
      - name: Compare with expected rows (make check-reproduce)
        run: make check-reproduce
      - name: Replay attacks in Icarus Verilog (make replay)
        run: make replay
      - name: Independent z3-free simulator (make validate)
        run: make validate
      - name: Headline numbers are consistent across documents
        run: python scripts/check_numbers.py --verify
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/reproduce_summary.json
            results/reproduce/
            results/logs/
          if-no-files-found: warn

  # The installed product: `pip install .` gives the glitchsat command, GlitchSAT Studio and every module.
  product-and-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write      # upload-sarif: findings of the gallery example to code scanning
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Yosys and Icarus Verilog (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
      - name: Install GlitchSAT from this checkout
        run: |
          python -m pip install --upgrade pip
          pip install -r ci/requirements-ci.txt pyyaml jsonschema
          pip install .
      - name: Commands of the installed package
        working-directory: ${{ runner.temp }}
        run: |
          glitchsat --help
          glitchsat --version
          glitchsat-studio --help
          glitchsat doctor || echo "doctor: some optional tools are missing (see above)"
      - name: Example from the gallery (findings as SARIF)
        working-directory: ${{ runner.temp }}
        run: |
          glitchsat examples copy hello_lock
          cd hello_lock
          set +e
          glitchsat run --sarif "$GITHUB_WORKSPACE/glitchsat-findings.sarif"
          rc=$?
          set -e
          echo "exit code $rc (1 = an attack was found, which this teaching example is built to show)"
          [ "$rc" = 1 ]
      - name: Every module suite (tools/)
        run: python scripts/test_all.py
      - name: Wording and path check of the shipped files
        run: python tools/check_wording.py tools product scripts
      - name: Upload the example findings to code scanning
        if: always() && hashFiles('glitchsat-findings.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: glitchsat-findings.sarif
          category: glitchsat-example
