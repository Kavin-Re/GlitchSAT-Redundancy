# Build and publish the `glitchsat` package to PyPI when a tag v* is pushed.
# STATUS: written, not run. Uses PyPI trusted publishing (configure the project on pypi.org first: Publishing ->
# add a GitHub publisher for this repository, workflow release.yml, environment pypi). No API token is stored.
# Third-party actions are pinned by commit SHA (tag in the comment; tags resolved 2026-11-21).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: build sdist and wheel of the whole product (repository root; product/ alone is the command line only)
        run: |
          python -m pip install build
          python -m build . --outdir dist
      - name: check the tag matches the package version
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('product/src/faultbound_wt/__init__.py').read())[1])")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != package version $v"; exit 1; }
      - name: check the project template points at this tag
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          wf=templates/glitchsat-project/.github/workflows/glitchsat.yml
          pc=templates/glitchsat-project/.pre-commit-config.yaml
          grep -Eq "product/action@$TAG\b" "$wf" || { echo "$wf does not use product/action@$TAG"; exit 1; }
          grep -Eq "^[[:space:]]*rev:[[:space:]]*$TAG\b" "$pc" || { echo "$pc does not use rev: $TAG"; exit 1; }
      - name: smoke test the wheel (no z3 needed for these commands)
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/glitchsat --version
          /tmp/v/bin/glitchsat-studio --help
          /tmp/v/bin/python -c "import importlib.resources as r; assert r.files('glitchsat_data').joinpath('tools','studio','studio.py').is_file()"
          /tmp/v/bin/glitchsat evidence-example /tmp/ex && /tmp/v/bin/glitchsat validate-sarif /tmp/ex/glitchsat.sarif
      - name: validate the example SARIF against the full OASIS SARIF 2.1.0 schema (pinned commit and sha256)
        env:
          SCHEMA_URL: https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json
          SCHEMA_SHA256: c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e
        run: |
          curl -fsSL -o /tmp/sarif-schema-2.1.0.json "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  /tmp/sarif-schema-2.1.0.json" | sha256sum -c -
          /tmp/v/bin/pip install "jsonschema>=4"
          /tmp/v/bin/glitchsat validate-sarif --schema /tmp/sarif-schema-2.1.0.json /tmp/ex/glitchsat.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
