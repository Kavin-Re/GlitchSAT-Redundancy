# GlitchSAT CLI. Distribution name "glitchsat"; the Python module keeps its original name faultbound_wt. License: Apache-2.0.
[build-system]
requires = ["setuptools>=77"]   # PEP 639 licence string (license = "Apache-2.0")
build-backend = "setuptools.build_meta"

[project]
name = "glitchsat"
version = "0.9.0"
description = "GlitchSAT: bounded fault-injection (bit-flip) analysis of Yosys gate-level netlists with z3."
readme = "README.md"
authors = [{ name = "Kavin.K.K" }]
keywords = ["fault injection", "glitch", "yosys", "sat", "hardware security", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Security",
  "Development Status :: 3 - Alpha",
]
license = "Apache-2.0"
requires-python = ">=3.10"
# No hard dependency: margin, evidence, sarif, validate-sarif, evidence-example and `check` on recorded results need
# no solver. `glitchsat analyze` (and `check` on targets without a recorded result) needs the `solver` extra.
# The exact solver version used for the recorded results (z3-solver==5.4.1.0) is pinned only in the reproducibility
# lock file ci/requirements-ci.txt of the repository.
dependencies = ["pyyaml>=6", "tomli>=1.1; python_version < '3.11'"]   # project files (glitchsat.yaml) of the own-design tool

[project.urls]
Homepage = "https://github.com/Kavin-Re/GlitchSAT-Redundancy"
Issues = "https://github.com/Kavin-Re/GlitchSAT-Redundancy/issues"

[project.optional-dependencies]
# the bounded solver: pip install "glitchsat[solver]"
solver = ["z3-solver>=5.4.1,<6"]
test = ["pytest>=8", "pyyaml", "jsonschema>=4", "z3-solver>=5.4.1,<6"]
# validate SARIF against the JSON schema (without it, only the GitHub rule checks run)
sarif = ["jsonschema>=4"]

[project.scripts]
glitchsat = "faultbound_wt.glitchsat_main:main"
glitchsat-hook = "faultbound_wt.precommit:main"
glitchsat-evidence = "faultbound_wt.evidence.cli:entry"
glitchsat-evidence-hook = "faultbound_wt.evidence.hook:main"
glitchsat-studio = "faultbound_wt.studio_launcher:main"
# older names, kept as aliases so existing scripts, the GitHub Action and the pre-commit hook keep working
faultbound-wt = "faultbound_wt.cli:main"
faultbound-wt-hook = "faultbound_wt.precommit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# tools/studio/: GlitchSAT Studio, copied into the package at integration (run by glitchsat-studio)
faultbound_wt = ["examples/*", "evidence/data/*.json", "evidence/data/recorded/*/*.json", "tools/studio/*", "tools/studio/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
